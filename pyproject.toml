[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ci-mpc-517"
version = "0.1.0"
description = "Simulation-first CI-MPC experiments for a gripper."
requires-python = ">=3.13,<3.14"
dependencies = [
    "drake; sys_platform != 'darwin' or platform_machine == 'arm64'",
    "numpy",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pyright",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ci_mpc_517"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["ci_mpc_517"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "PT"]
