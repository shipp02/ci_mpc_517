[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ci-mpc-517"
version = "0.1.0"
description = "Simulation-first CI-MPC experiments for a gripper."
requires-python = ">=3.12,<3.13"
dependencies = [
    "drake==1.34.0",
    "numpy",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pyright",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ci_mpc_517"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["ci_mpc_517"]

[tool.ruff]
target-version = "py312"
extend-exclude = [".superpowers", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "PT"]
